name: reviewdog
on:
  pull_request:
    types: [synchronize, opened]
jobs:
  eslint:
    name: runner / eslint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_GITHUB_TOKEN }}

      # Reports findings on the changed lines as PR review comments. Only
      # `error`-level findings fail the check; the legacy rules downgraded to
      # `warn` in .eslintrc (prettier, no-explicit-any, no-unused-vars,
      # literal strings, import order) show up as comments without blocking.
      - uses: reviewdog/action-eslint@v1
        with:
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
          eslint_flags: 'src --ext .ts,.tsx'
